name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-compile-check:
    name: backend compile (python -m compileall)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request' ||
      contains(toJSON(github.event.head_commit.modified) , 'backend/') ||
      contains(toJSON(github.event.head_commit.added) , 'backend/') ||
      contains(toJSON(github.event.head_commit.removed) , 'backend/') ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile-check backend Python sources
        run: python -m compileall -q backend

  frontend-build:
    name: frontend build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Next.js frontend
        run: npm run build
